; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ESP-WROOM-32 / ESP32 ESP-32S DevKit (generic 30-pin or 38-pin board).
; Upload: pio run -e blink -t upload
; Serial: pio device monitor -e blink

[env:blink]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<blink.cpp>

[env:panel_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<panel_test.cpp>
lib_deps =
    fastled/FastLED @ ^3.6.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
; WS2812B 8x32 LED Panel Test (GPIO 13)

; Upload: pio run -e panel_test -t upload
; Serial: pio device monitor -e panel_test

