; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ESP-WROOM-32 / ESP32 ESP-32S DevKit (generic 30-pin or 38-pin board).
; Upload: pio run -e blink -t upload
; Serial: pio device monitor -e blink

[env:blink]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<blink.cpp>

[env:panel_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<panel_test.cpp>
lib_deps =
    fastled/FastLED @ ^3.6.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
; WS2812B 8x32 LED Panel Test (GPIO 13)
; Upload: pio run -e panel_test -t upload
; Serial: pio device monitor -e panel_test

[env:animate-sun]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<animate-sun.cpp>
lib_deps =
    fastled/FastLED @ ^3.6.0
; Sun-only 32x24 crop of the 36x28 painting (GPIO 13)
; Upload: pio run -e animate-sun -t upload
; Serial: pio device monitor -e animate-sun

[env:animate-sun-moon-stars]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<animate-sun-moon-stars.cpp>
lib_deps =
    fastled/FastLED @ ^3.6.0
; Sun, then moon with ~6 random stars (GPIO 13)
; Upload: pio run -e animate-sun-moon-stars -t upload
; Serial: pio device monitor -e animate-sun-moon-stars

; WS2812B strip on GPIO 13 (D13). Upload: pio run -e power-test -t upload
[env:power-test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<power-test.cpp>
lib_deps = fastled/FastLED
